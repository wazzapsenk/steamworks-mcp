# What this tool can do in Steamworks, per area, and how. Rendered to docs/CAPABILITIES.md (scripts/gen_docs.py).
#   api:      official, documented tooling (partner Web API with a publisher key, steamcmd / SteamPipe)
#   browser:  opt-in BROWSER mode, driving the partner site in the user's logged-in window (undocumented behaviour)
#   status:   verified (recorded live, fixtures in tests/fixtures/steamworks) | partial | unverified | never
#   default_mode / fallback_mode: what the tool uses; fallback applies when BROWSER mode is off.
last_reviewed: '2026-10-03'
permissions:
  browser_mode:
    - Edit App Metadata
    - Edit App Marketing Data
  builder_account:
    - Edit App Metadata
    - Publish App Changes To Steam
  never_needed:
    - Manage Pricing & Discounts
    - View Financial Info
    - Manage Signing / Actual Authority permissions
  notes: >-
    Give automation its own Steamworks user. The tool never publishes, so BROWSER mode does not need "Publish App
    Changes To Steam". steamcmd uploads do (Valve's builder-account recommendation). Setting a build live on the
    default branch of a released app also needs the account's phone number or Steam Mobile authenticator.
areas:
  - id: build_upload
    name: Build upload (depots, app_build VDF)
    api: {status: unverified, how: "steamcmd / SteamPipe with the builder account"}
    browser: {status: never}
    default_mode: API
    fallback_mode: ARTIFACT
    notes: Without steamcmd configured, the tool writes the app_build / depot_build VDFs and the command to run.
  - id: set_build_live
    name: Set a build live on a branch
    api: {status: unverified, how: "ISteamApps/SetAppBuildLive (beta branches)"}
    browser: {status: never}
    default_mode: MANUAL
    notes: >-
      set_build_live sets beta branches live through the Web API after the user confirms. The default branch is
      always set live by hand in App Admin (Valve: build scripts cannot target it); on a released app the account
      also has to confirm on its phone / Steam Mobile app.
  - id: builds_list
    name: List builds and branches
    api: {status: partial, how: "ISteamApps/GetAppBuilds, GetAppBetas"}
    browser: {status: never}
    default_mode: API
    fallback_mode: MANUAL
    notes: >-
      Recorded on an app without builds only: both calls then answer HTTP 500. The answer for an app with builds is
      not recorded yet.
  - id: leaderboards
    name: Leaderboards
    api: {status: verified, how: "ISteamLeaderboards/FindOrCreateLeaderboard, GetLeaderboardsForGame, DeleteLeaderboard"}
    browser: {status: never}
    default_mode: API
    fallback_mode: MANUAL
    notes: >-
      GetLeaderboardsForGame is cached for about a minute, so the tool reads the boards it changes one by one
      (FindOrCreateLeaderboard without creating). Settings of an existing board are only reported, never changed.
  - id: achievement_schema_read
    name: Read the achievement and stat schema
    api: {status: partial, how: "ISteamUserStats/GetSchemaForGame (publisher key)"}
    browser: {status: verified, how: "apps/fetchachievements"}
    default_mode: API
    fallback_mode: MANUAL
    notes: The API returns the published schema only; recorded on an app with nothing published yet (empty answer).
  - id: achievements
    name: Achievement definitions, localized names, icons
    api: {status: never, how: "no Web API writes achievement definitions"}
    browser: {status: verified, how: "apps/newachievement, saveachievement, images/uploadachievement, deleteachievement"}
    default_mode: BROWSER
    fallback_mode: ARTIFACT
    notes: Steamworks accepts duplicate API names; the tool validates before writing.
  - id: achievement_localization_file
    name: Achievement localization file (KeyValues)
    api: {status: never}
    browser: {status: partial, how: "apps/uploadachievementloc"}
    default_mode: ARTIFACT
    notes: >-
      Upload is accepted but the token names that apply to page-created achievements are unknown, and the export is
      empty before publishing. Localized names are written through saveachievement instead.
  - id: stats
    name: Stat definitions
    api: {status: never}
    browser: {status: unverified}
    default_mode: MANUAL
  - id: steam_cloud
    name: Steam Cloud quota, flags, Auto-Cloud paths and root overrides
    api: {status: never}
    browser: {status: verified, how: "apps/setufsparameters, setautocloudpath, setautocloudoverride"}
    default_mode: BROWSER
    fallback_mode: MANUAL
    notes: >-
      Steamworks silently clamps quotas and replaces unknown roots with gameinstall; the tool validates first.
      Saving an Auto-Cloud path turns "developers only" back on, so quotas and flags are written last.
  - id: store_text
    name: Store page short description and About This Game, all languages
    api: {status: never}
    browser: {status: verified, how: "Localization tab import (admin/game/uploadloc), partial uploads"}
    default_mode: BROWSER
    fallback_mode: ARTIFACT
    notes: The ARTIFACT is the same JSON file the Localization tab imports.
  - id: store_other
    name: Other store page fields (system requirements, links, legal line, languages table, genres, categories, tags)
    api: {status: never}
    browser: {status: unverified}
    default_mode: MANUAL
  - id: graphical_assets
    name: Capsules, screenshots, trailers, library assets
    api: {status: never}
    browser: {status: unverified}
    default_mode: ARTIFACT
    notes: Images are cropped from the user's own art at the exact sizes; artwork is never generated.
  - id: icons
    name: App icon and shortcut icon
    api: {status: never}
    browser: {status: unverified}
    default_mode: ARTIFACT
  - id: installation
    name: Install folder and launch options (with localized descriptions)
    api: {status: never}
    browser: {status: verified, how: "apps/setappinstallfolder, setlaunchoption"}
    default_mode: BROWSER
    fallback_mode: MANUAL
  - id: depots
    name: Depots, OS support, packages
    api: {status: never}
    browser: {status: unverified}
    default_mode: MANUAL
  - id: pricing
    name: Pricing and discounts
    api: {status: never}
    browser: {status: never}
    default_mode: MANUAL
  - id: content_survey
    name: Content survey, mature content, AI disclosure, ratings
    api: {status: never}
    browser: {status: never}
    default_mode: MANUAL
    notes: Never automated; the tool prepares the answers.
  - id: pending_changes
    name: What is still unpublished
    api: {status: never}
    browser: {status: verified, how: apps/diff (the Publish page's read-only "View Diffs")}
    default_mode: BROWSER
    fallback_mode: MANUAL
  - id: publishing
    name: Publishing Steamworks changes, posting Coming Soon, releasing
    api: {status: never}
    browser: {status: never}
    default_mode: MANUAL
    notes: Never automated. Publish, Prepare for Publishing, Revert and Release are blocked in code.
