[project]
name = "steamworks-mcp"
version = "0.3.1"
description = "Release assistant for Steam games, as an MCP server for Claude and ChatGPT: store page, achievements, checks against Valve's rules, market data, and Steamworks only after you approve."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Burak Kaan Sahin" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "model-context-protocol", "steam", "steamworks", "gamedev", "release", "localization", "claude", "chatgpt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "mcp>=2.1,<3",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pillow>=10.4",
  "ruamel.yaml>=0.18.6",
]

[project.scripts]
steamworks-mcp = "steamworks_mcp.__main__:main"

[project.optional-dependencies]
# Opt-in Steamworks panel automation (BROWSER execution mode). Never needed for the other modes.
browser = ["playwright>=1.48"]

[project.urls]
Homepage = "https://burakkaan.dev/steamworks-mcp"
Repository = "https://github.com/wazzapsenk/steamworks-mcp"
Documentation = "https://github.com/wazzapsenk/steamworks-mcp/blob/main/docs/ADVANCED.md"
Issues = "https://github.com/wazzapsenk/steamworks-mcp/issues"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "anyio>=4.6",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamworks_mcp"]

# Only what belongs in a source release: local-only files (notes, specs, settings) must never ship.
[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "skills",
  "rules",
  "examples",
  "scripts",
  ".claude-plugin",
  ".cursor-plugin",
  "server.json",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = ["tests/fixtures", ".steam-mcp"]

# PyPI shows the README as the package page: relative links become links into the repository.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/wazzapsenk/steamworks-mcp/blob/main/\g<1>)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
exclude = ["^spikes/"]

[[tool.mypy.overrides]]
module = ["playwright.*"]  # the optional [browser] extra
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true
