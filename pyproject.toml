[project]
name = "steamworks-mcp"
version = "0.2.0.dev0"
description = "MCP server that takes a Steam game from nothing configured to released: release gates, gap reports, interviews, generators, validators, export packages and optional Steamworks automation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Burak Kaan Sahin" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "steam", "steamworks", "gamedev", "release", "localization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "mcp>=2.1,<3",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pillow>=10.4",
  "ruamel.yaml>=0.18.6",
]

[project.optional-dependencies]
# Opt-in Steamworks panel automation (BROWSER execution mode). Never needed for the other modes.
browser = ["playwright>=1.48"]

[project.urls]
Repository = "https://github.com/wazzapsenk/steamworks-mcp"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "anyio>=4.6",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steamworks_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["legacy", "tests/fixtures", "spikes", ".steamworks-mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["^legacy/", "^spikes/"]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true
